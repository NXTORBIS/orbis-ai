<svg viewBox="0 0 600 150" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="ringGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a0e7e5;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#7dd3cf;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5ab9b0;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Ring mark -->
  <g transform="translate(50, 75)">
    <!-- Outer glow -->
    <circle cx="0" cy="0" r="38" fill="none" stroke="#00bfff" stroke-width="0.5" opacity="0.3" filter="url(#glow)"/>
    <!-- Main ring -->
    <path d="M 0 -32 A 32 32 0 0 1 22.63 22.63 A 32 32 0 0 1 -22.63 22.63 A 32 32 0 0 1 -22.63 -22.63 A 32 32 0 0 1 0 -32"
          fill="none" stroke="url(#ringGradient)" stroke-width="5" stroke-linecap="round" filter="url(#glow)"/>
  </g>

  <!-- Text: ORBIS -->
  <text x="110" y="105" font-family="Georgia, serif" font-size="72" font-weight="bold" fill="white" filter="url(#glow)" letter-spacing="2">ORBIS</text>

  <!-- Accent line under text -->
  <line x1="110" y1="115" x2="480" y2="115" stroke="#00bfff" stroke-width="1" opacity="0.5"/>
</svg>