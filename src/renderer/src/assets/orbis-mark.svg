<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="ringGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a0e7e5;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#7dd3cf;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5ab9b0;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Outer glow -->
  <circle cx="100" cy="100" r="95" fill="none" stroke="#00bfff" stroke-width="1" opacity="0.3" filter="url(#glow)"/>
  <!-- Main ring with gradient -->
  <path d="M 100 20 A 80 80 0 0 1 156.57 143.43 A 80 80 0 0 1 43.43 156.57 A 80 80 0 0 1 43.43 43.43 A 80 80 0 0 1 100 20"
        fill="none" stroke="url(#ringGradient)" stroke-width="12" stroke-linecap="round" filter="url(#glow)"/>
  <!-- Inner glow highlight -->
  <circle cx="100" cy="100" r="75" fill="none" stroke="#00ffff" stroke-width="1" opacity="0.2"/>
</svg>