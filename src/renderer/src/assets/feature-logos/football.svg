<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 411 110" role="img" aria-label="FOOTBALL">
  <defs><style>.spark{opacity:0}svg:hover .spark{animation:burst .9s ease-out infinite}@keyframes burst{0%{opacity:0;transform:translate(0,0) scale(.3)}30%{opacity:1}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.1)}}.spark:nth-of-type(2n){animation-delay:.12s}</style>
    <filter id="tint-football" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="7" result="g"/>
      <feFlood flood-color="#6dd36d" flood-opacity="0.55"/>
      <feComposite in2="g" operator="in" result="glow"/>
      <feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="emb-football" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="halo-football" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="9"/></filter>
    <filter id="glow-football" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  <linearGradient id="shimmer-football" x1="-1" y1="0" x2="0" y2="0"><stop offset="0" stop-color="#ffffff"/><stop offset="0.45" stop-color="#ffffff"/><stop offset="0.5" stop-color="#6dd36d"/><stop offset="0.55" stop-color="#ffffff"/><stop offset="1" stop-color="#ffffff"/><animate attributeName="x1" values="-1;1" dur="3.2s" repeatCount="indefinite"/><animate attributeName="x2" values="0;2" dur="3.2s" repeatCount="indefinite"/></linearGradient></defs>
  <g transform="translate(68.1 55.0)"><circle r="27" fill="#6dd36d" fill-opacity="0.09" filter="url(#halo-football)"><animate attributeName="fill-opacity" values="0.05;0.14;0.05" dur="4s" repeatCount="indefinite"/></circle><g transform="rotate(-20)"><ellipse rx="21" ry="8" fill="none" stroke="#6dd36d" stroke-width="1" stroke-opacity="0.7" stroke-dasharray="2 3"/><circle r="2.6" fill="#ffffff" filter="url(#emb-football)"><animateMotion dur="5s" repeatCount="indefinite" path="M21 0A21 8 0 1 1 -21 0A21 8 0 1 1 21 0"/></circle><circle r="1.2" fill="#6dd36d"><animateMotion dur="5s" repeatCount="indefinite" path="M21 0A21 8 0 1 1 -21 0A21 8 0 1 1 21 0"/></circle></g></g>
  <g transform="translate(68.1 55.0) scale(1.05)" fill="none" stroke="#6dd36d" stroke-width="7" stroke-opacity="0.22" stroke-linecap="round" stroke-linejoin="round" filter="url(#emb-football)"><animate attributeName="stroke-opacity" values="0.14;0.4;0.14" dur="3s" repeatCount="indefinite"/><circle cx="0" cy="0" r="13" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"><animate attributeName="stroke-dashoffset" from="1" to="0" dur="1.6s" begin="0.30s" fill="freeze"/></circle><path d="M0-6l5 3.5-2 6h-6l-2-6z" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"><animate attributeName="stroke-dashoffset" from="1" to="0" dur="1.6s" begin="0.30s" fill="freeze"/></path><path d="M0-13v7M12.4-4l-6 3.5M-12.4-4l6 3.5M7.7 10.6l-3.7-5M-7.7 10.6l3.7-5" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"><animate attributeName="stroke-dashoffset" from="1" to="0" dur="1.6s" begin="0.30s" fill="freeze"/></path></g>
  <g transform="translate(68.1 55.0) scale(1.05)" fill="none" stroke="#6dd36d" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="0" cy="0" r="13" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"><animate attributeName="stroke-dashoffset" from="1" to="0" dur="1.6s" begin="0.50s" fill="freeze"/></circle><path d="M0-6l5 3.5-2 6h-6l-2-6z" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"><animate attributeName="stroke-dashoffset" from="1" to="0" dur="1.6s" begin="0.50s" fill="freeze"/></path><path d="M0-13v7M12.4-4l-6 3.5M-12.4-4l6 3.5M7.7 10.6l-3.7-5M-7.7 10.6l3.7-5" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"><animate attributeName="stroke-dashoffset" from="1" to="0" dur="1.6s" begin="0.50s" fill="freeze"/></path></g>
  <text x="138.2" y="55.0" dominant-baseline="central" font-family="Bodoni Moda, 'Bodoni MT', Didot, Cambria, Georgia, 'Times New Roman', serif" font-size="44" letter-spacing="3" fill="url(#shimmer-football)" filter="url(#glow-football)">FOOTBALL</text>
