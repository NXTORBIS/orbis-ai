      Orion, about the page in front of you: a question about it, a short version of it, or something done on it.

      <main id="ask-thread" aria-live="polite"></main>
      <form id="ask-form">
        <textarea id="ask-input" rows="2" placeholder="Ask about this page…" aria-label="Ask Orion about this page"></textarea>
        <div class="ask-send-row">
          <button id="ask-reread" class="ask-ico" type="button" title="Look at this page again" aria-label="Look at this page again">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/></svg>
          </button>
          <span class="ask-hint" id="ask-hint">Enter to send</span>
          <button id="ask-mic" class="ask-ico ask-mic" type="button" title="Speak your question" aria-label="Speak your question" aria-pressed="false" hidden>
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
          </button>
          <button id="ask-stop" class="ask-round ask-stop" type="button" title="Stop" aria-label="Stop" hidden>
            <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2.5"/></svg>
          </button>
          <button id="ask-send" class="ask-round ask-go" type="submit" title="Ask (Enter)" aria-label="Ask" disabled>
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
          </button>
        </div>
      </form>
    </section>

    <section id="view-search" class="view" hidden>
      <form id="search-form">
        <input id="query" type="search" placeholder="Search the web…" aria-label="Search" autocomplete="off" />
        <button type="submit">Search</button>
      </form>
      <main id="results" aria-live="polite">
        <p id="search-empty" class="empty">Search the web with Orbis. Nothing is sent anywhere but the search itself.</p>
      </main>
      <div id="search-actions" hidden>
      </div>
    </section>

    <section id="view-block" class="view" hidden>
      <main id="block" aria-live="polite"></main>
    </section>

    <!-- The pages this person has read. Everything in it came from browsing, so this is where it is looked up. -->
    <section id="view-recall" class="view" hidden>
      <main id="recall"></main>
    </section>

    <!-- Things Orbis does at a time you chose. The same schedules the chat window shows, over the helper. -->
    <section id="view-schedules" class="view" hidden>
      <main id="schedules" aria-live="polite"></main>
    </section>

    <section id="view-notes" class="view" hidden>
      <main id="notes"></main>
    </section>

    <section id="view-tasks" class="view" hidden>
      <main id="tasks"></main>
    </section>

    <section id="view-workflows" class="view" hidden>
      <main id="workflows"></main>
    </section>

    <section id="view-galaxy" class="view" hidden>
      <main id="galaxy"></main>
    </section>

    <section id="view-secrets" class="view" hidden>
      <main id="secrets"></main>
    </section>

    <!-- Focus: the part of Orbis Student that belongs where the reading happens. The rest is in the Orbis window. -->
    <section id="view-student" class="view" hidden>
      <main id="student" aria-live="polite"></main>
    </section>

    <!-- Orbis Music: what is playing, your library, the queue, and the song playing on the page in front of you. -->
    <section id="view-music" class="view" hidden>
      <main id="music" aria-live="polite"></main>
    </section>

    </div>
    <script type="module" src="panel.js"></script>
    <script type="module" src="panel-adblock.js"></script>
    <script type="module" src="panel-recall.js"></script>
    <script type="module" src="panel-schedules.js"></script>
    <script type="module" src="panel-notes.js"></script>
    <script type="module" src="panel-tasks.js"></script>
    <script type="module" src="panel-workflows.js"></script>
    <script type="module" src="panel-galaxy.js"></script>
    <script type="module" src="panel-secrets.js"></script>
    <script type="module" src="panel-student.js"></script>
    <script type="module" src="panel-music.js"></script>
    <script type="module" src="panel-account.js"></script>
  </body>
</html>
