<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>New Tab</title>
    <meta name="color-scheme" content="dark light" />
    <style>html { background: #060708; } @media (prefers-color-scheme: light) { html { background: #d9dfe8; } }</style>
    <link rel="icon" type="image/png" href="orbis-ring.png" />
    <link rel="stylesheet" href="orbis-tokens.css" />
    <link rel="stylesheet" href="newtab.css" />
    <link rel="stylesheet" href="intro.css" />
  </head>
  <body>
    <div class="topright">
      <button id="openWidgets" class="gear" type="button" aria-label="Widgets on this page">Widgets</button>
      <button id="openSettings" class="gear" type="button" aria-label="Customize this page">Customize</button>
    </div>
    <nav id="rail" class="rail" aria-label="Orbis"></nav>
    <main>
      <!--
        The Orbis mark, drawn rather than photographed.

        It was `orbis-ring.png` -- 549 pixels of artwork drawn at 76, which is a downscale large enough that the
        browser picks a cheap filter and the edges come out soft. The same two crossed rings the Orb wears, in the
        same proportions, written out here because this page has no script it needs to wait for and a mark that
        appears a moment after the page does is a mark that flickers on every new tab.

        `aria-hidden` with the name on the figure: a decorative drawing of a brand should not be read out as a
        list of ellipses, and the page says "Orbis" in its heading anyway.
      -->
      <svg class="logo" viewBox="0 0 100 100" width="76" height="76" role="img" aria-label="Orbis" focusable="false">
        <defs>
          <linearGradient id="nt-ring-a" x1="12%" y1="0%" x2="88%" y2="100%">
            <stop offset="0%" stop-color="#f4f8fb" />
            <stop offset="26%" stop-color="#9fb3c0" />
            <stop offset="54%" stop-color="#2b3a45" />
            <stop offset="78%" stop-color="#0b1218" />
            <stop offset="100%" stop-color="#050a0e" />
          </linearGradient>
          <linearGradient id="nt-ring-b" x1="88%" y1="0%" x2="12%" y2="100%">
            <stop offset="0%" stop-color="#f4f8fb" />
            <stop offset="26%" stop-color="#9fb3c0" />
            <stop offset="54%" stop-color="#2b3a45" />
            <stop offset="78%" stop-color="#0b1218" />
            <stop offset="100%" stop-color="#050a0e" />
          </linearGradient>
          <linearGradient id="nt-ring-glint" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#7ff0ff" stop-opacity="0" />
            <stop offset="38%" stop-color="#7ff0ff" stop-opacity="0.95" />
            <stop offset="62%" stop-color="#3fd8ff" stop-opacity="0.35" />
            <stop offset="100%" stop-color="#7ff0ff" stop-opacity="0" />
          </linearGradient>
        </defs>
        <ellipse cx="50" cy="50" rx="37" ry="26" fill="none" stroke="url(#nt-ring-a)" stroke-width="6.2" transform="rotate(-22 50 50)" />
        <ellipse cx="50" cy="50" rx="37" ry="26" fill="none" stroke="url(#nt-ring-b)" stroke-width="6.2" transform="rotate(22 50 50)" />
        <ellipse cx="50" cy="50" rx="37" ry="26" fill="none" stroke="url(#nt-ring-glint)" stroke-width="1.6" transform="rotate(-22 50 50)" />
        <ellipse cx="50" cy="50" rx="37" ry="26" fill="none" stroke="url(#nt-ring-glint)" stroke-width="1.6" transform="rotate(22 50 50)" />
      </svg>
      <p id="clock" class="clock" aria-live="off"></p>
      <p id="countdown" class="countdown"></p>
      <form id="search" role="search">
        <input id="q" type="text" autocomplete="off" spellcheck="false" placeholder="Search or type a URL" aria-label="Search or type a URL" autofocus />
      </form>
      <!-- Orbis Music: what is playing, or the way in when nothing is. Always here, on every new tab. -->
      <div id="musicEntry" class="music-entry" hidden></div>
      <p id="empty" class="empty" hidden>No shortcuts yet. Add the sites you use most.</p>
      <nav id="shortcuts" class="sites" aria-label="Shortcuts"></nav>
    </main>
    <!--
      The widgets, below the column.

      Outside <main> because the column is 680px wide and a board of widgets is up to six cells -- just over a
      thousand. It is its own centred strip, and the page scrolls when the board is taller than the window.
    -->
    <section id="widgets" class="wg-host" aria-label="Widgets"></section>

    <dialog id="shortcutDialog">
      <form id="shortcutForm" method="dialog">
        <h2 id="scTitle">Add shortcut</h2>
        <label>Name (optional)<input id="scName" type="text" maxlength="60" autocomplete="off" /></label>
        <label>Web address<input id="scUrl" type="text" autocomplete="off" spellcheck="false" placeholder="example.com" /></label>
        <p id="scError" class="err" role="alert"></p>
        <div class="row"><button type="button" id="scCancel">Cancel</button><button type="submit" class="primary">Save</button></div>
      </form>
    </dialog>

    <dialog id="settingsDialog">
      <form id="settingsForm" method="dialog">
        <h2>Customize</h2>
        <label class="chk"><input id="sClock" type="checkbox" />Show date and time</label>
        <label class="chk"><input id="sHour12" type="checkbox" />12-hour clock</label>
        <label class="chk"><input id="sSeconds" type="checkbox" />Show seconds</label>
        <label class="chk"><input id="sShortcuts" type="checkbox" />Show shortcuts</label>
        <label class="chk"><input id="sRail" type="checkbox" />Show the Orbis rail</label>
        <label>Background<select id="sWallpaper"></select></label>
        <label>Use my own picture<input id="sPicture" type="file" accept="image/png,image/jpeg,image/webp" /></label>
        <label>Countdown label<input id="sCdLabel" type="text" maxlength="60" autocomplete="off" /></label>
        <label>Countdown date (empty for none)<input id="sCdDate" type="date" /></label>
        <p id="sError" class="err" role="alert"></p>
        <div class="row"><button type="button" id="sCancel">Cancel</button><button type="submit" class="primary">Save</button></div>
      </form>
    </dialog>
    <script type="module" src="newtab.js"></script>
  </body>
</html>
