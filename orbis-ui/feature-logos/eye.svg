<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 403 110" role="img" aria-label="ORBISEYE">
  <defs>
    <linearGradient id="ring-eye" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2f7fa" stop-opacity="0.75"/>
      <stop offset="0.5" stop-color="#5b6b78" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#7fe6f5" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="glow-eye" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g transform="translate(66.0 55.0)">
    <ellipse rx="28" ry="21" transform="rotate(-20)" fill="#ffffff" fill-opacity="0.04" stroke="url(#ring-eye)" stroke-width="3"/>
    <ellipse rx="28" ry="21" transform="rotate(-20)" fill="none" stroke="#7fe6f5" stroke-opacity="0.35" stroke-width="7"/>
  </g>
  <text x="126" y="55.0" dominant-baseline="central" font-family="Bodoni Moda, 'Bodoni MT', Didot, Cambria, Georgia, 'Times New Roman', serif" font-size="44" font-weight="400" letter-spacing="3" fill="#ffffff" filter="url(#glow-eye)">ORBISEYE</text>
</svg>
