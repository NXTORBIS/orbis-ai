appId: ai.nxtorbis.desktop
productName: Orbis
# Orbis is built on castLabs' Electron, which carries the content decryption module protected sites need (Spotify,
# Netflix and the rest). Packaging must use that exact build rather than downloading the ordinary one.
electronDist: node_modules/electron/dist
directories:
  buildResources: build
  output: dist
asarUnpack:
  # koffi's native library (Win32 calls that embed the browser window) must be a real file on disk.
  - node_modules/koffi/**
files:
  - out/**
  - package.json
# Filter lists that ship with Orbis, so ad blocking works on first run and offline (updated at runtime).
extraResources:
  - from: resources/adblock
    to: adblock
  # whisper.cpp's official prebuilt Windows binary (MIT) and the DLLs it loads. Speech to text runs this locally;
  # the multi-gigabyte model files it reads are downloaded into the user's own data directory, not bundled here.
  - from: resources/whisper
    to: whisper
  # The licences of everything Orbis is built from. Most of them require their text to travel with the app.
  - from: resources/notices.json
    to: notices.json
  # The worker that drives the ACE-Step engine NEUROVA installs on the user's machine (MIT upstream; not bundled).
  - from: resources/neurova
    to: neurova
  # ORBIS COSMOS, the Gaia Sky simulation (MPL-2.0): its source and assets, and what `npm run cosmos:build` made.
  - from: cosmos
    to: cosmos
    filter:
      - '**/*'
      - '!build/**'
      - '!core/build/**'
      - '!.gradle/**'
      - '!.build/runtime.txt'
  # OrbisEye, the live Earth console: its own small server (started on demand) with the packages it needs.
  - from: orbiseye
    to: orbiseye
    filter:
      - '**/*'
      - '!docs/**'
      - '!.env'
  # Orbis's own Chromium build (its resources/orbis_extension is the built-in component extension), plus the extension sources the app copies to a writable folder so ad-block filter lists can be updated (built by `npm run stage:browser`).
  - from: resources/chromium
    to: chromium
  - from: extension
    to: extension
    filter:
      - "**/*"
      - "!**/*.map"
      - "!_metadata/**"
      - "!helper.json"
win:
  target: nsis
  artifactName: ${productName}-Setup-${version}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
