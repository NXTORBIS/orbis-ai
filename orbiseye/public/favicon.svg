<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="favicon-title">
  <title id="favicon-title">OrbisEye</title>
  <!-- Purpose-built tab icon. logo.svg is a wide 775x520 title-bar mark, which
       collapses into an unreadable smudge at 16px; this is three bold shapes
       that survive the downscale. Orbis = the ring, Eye = the pupil. -->
  <rect width="64" height="64" rx="14" fill="#0d1219"/>
  <circle cx="32" cy="32" r="17" fill="none" stroke="#00d4ff" stroke-width="5"/>
  <circle cx="32" cy="32" r="7" fill="#00d4ff"/>
</svg>
